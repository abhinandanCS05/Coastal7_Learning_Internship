name: ShopFlow Day 23 DevOps CI

on:
  push:
    branches:
      - day23-devops-remote
      - day22-ai-application
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    name: Backend and frontend validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Check Python syntax
        run: python -m compileall -q backend/app backend/tests

      - name: Python lint
        run: ruff check backend/app backend/tests --select E9,F63,F7,F82

      - name: Run backend tests
        env:
          DATABASE_URL: sqlite:///./ci-shopflow.db
          JWT_SECRET: ci-only-test-secret
          FRONTEND_ORIGIN: http://localhost:5173
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: backend
        run: pytest -q backend/tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript validation
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

  compose-smoke-test:
    name: Docker Compose integration test
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start complete stack
        run: docker compose up -d --build

      - name: Wait for backend and frontend
        shell: bash
        run: |
          set -e
          for i in {1..60}; do
            if curl --fail --silent http://localhost:8000/health >/dev/null &&
               curl --fail --silent http://localhost:8080/health >/dev/null; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              docker compose ps
              docker compose logs --no-color
              exit 1
            fi
            sleep 5
          done

      - name: Verify API and frontend
        run: |
          curl --fail --show-error http://localhost:8000/health
          curl --fail --show-error http://localhost:8000/products
          curl --fail --show-error http://localhost:8080/health

      - name: Print service status
        if: always()
        run: docker compose ps

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v

  publish:
    name: Publish container images to GHCR
    runs-on: ubuntu-latest
    needs: compose-smoke-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/day23-devops-remote' || github.ref == 'refs/heads/day22-ai-application' || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/shopflow-backend:${{ github.sha }}

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=http://localhost:8000
            VITE_WS_URL=ws://localhost:8000
          tags: ghcr.io/${{ github.repository_owner }}/shopflow-frontend:${{ github.sha }}
