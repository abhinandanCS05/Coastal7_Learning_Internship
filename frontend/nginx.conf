server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log off;
    default_type text/plain;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
